# Adapted from https://github.com/mit-plv/fiat-crypto/blob/master/.github/workflows/coq-docker.yml

name: CI (Coq, docker, dev)

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - env: { COQ_VERSION: "9.2", DOCKER_COQ_VERSION: "9.2" }
          os: 'ubuntu-latest'
        - env: { COQ_VERSION: "master", DOCKER_COQ_VERSION: "dev" }
          os: 'ubuntu-latest'

    runs-on: ${{ matrix.os }}
    env: ${{ matrix.env }}
    name: ${{ matrix.env.COQ_VERSION }}

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.env.COQ_VERSION }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: all
      uses: coq-community/docker-coq-action@v1
      with:
        coq_version: ${{ matrix.env.DOCKER_COQ_VERSION }}
        custom_script: sudo chmod -R a=u . && TIMED=1 make -j "$(nproc)" -k
    - name: bluespec-test
      uses: coq-community/docker-coq-action@v1
      with:
        coq_version: ${{ matrix.env.DOCKER_COQ_VERSION }}
        custom_script: |
          sudo chmod -R a=u .
          sudo apt-get update -y -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends iverilog
          curl -fsSL -o /tmp/bsc.tar.gz https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz
          printf '%s  /tmp/bsc.tar.gz\n' 9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3 | sha256sum -c
          tar -C /tmp -xzf /tmp/bsc.tar.gz
          PATH="/tmp/bsc-2026.01-debian-12.13/bin:$PATH" make -C processor/integration bluespec-test
    - name: install
      uses: coq-community/docker-coq-action@v1
      with:
        coq_version: ${{ matrix.env.DOCKER_COQ_VERSION }}
        custom_script: sudo make install COQBIN="$(dirname "$(which rocq)")/"
